# D-075 step 3a: the light verifier on the robot. dev3 episodes (paired with dev_confirm), the new settings of stage 4
# (parse v4, English short-name question, last metre), but the candidate is verified by SigLIP 2 zero-shot ("sig",
# calib/siglip_zero_v1.json, fitted on dev crops without dev3) instead of the language model. The parses are replayed
# from the dev_confirm arm of the same model (backend=replay, same prompts): no VLM server, three robots in parallel.
# Rule (docs/decisions.md D-075): adopted for every verifier arm if Qolda kk gets at least 5 more successes than
# dev_confirm/qolda_kk (17 of 72).
name: dev_light
title: "DEV: light SigLIP verifier on the robot (D-075, step 3a)"
out_root: runs/matrix
seeds: [0]
common:
  - dataset=hm3d_objectnav_v1_train
  - embodiment=wheeled_vacuum_kinematic
  - eval.episode_budget.max_decision_steps=800
  - value_encoder=siglip2_base
  - run.episodes.subset_file=splits/hm3d_v1_dev3.txt
  - run.video.fraction=0.2
  - backend=replay
  - backend.prompts.parse_goal=default/parse_goal/v4
  - policy.verification.question_lang=en
  - policy.verification.commit_approach=true
  - policy.verification.verify_range_m=1.5
  - policy.approach.stop_mode=visible
  - policy.verification.backend=siglip_zero
  - policy.stop.calibration_file=calib/siglip_zero_v1.json
arms:
  - {key: qolda_kk_lv, label: "Qolda kk (parse), SigLIP verifier", lang: kk, accent: true,
     overrides: ["backend.replay.sources=[runs/matrix/dev_confirm/qolda_kk/seed0/vlm_calls.jsonl]"]}
  - {key: qwen_kk_lv, label: "Qwen3-VL-4B kk (parse), SigLIP verifier", lang: kk,
     overrides: ["backend.replay.sources=[runs/matrix/dev_confirm/qwen_kk/seed0/vlm_calls.jsonl]"]}
  - {key: mt_qwen_kk_lv, label: "NLLB kk->en, Qwen3-VL-4B (parse), SigLIP verifier", lang: kk,
     overrides: [goal=mt_command, "backend.replay.sources=[runs/matrix/dev_confirm/mt_qwen_kk/seed0/vlm_calls.jsonl]"]}
breakdowns: [goal_category]
