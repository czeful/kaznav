# D-081 (repeat of D-078 with the human speaker S01): spoken kk commands on the standard agent, everything as the arm qolda_kk of dev_agent_final (stage 5,
# 44.0%) except where the parse comes from: recorded calls (++backend.parse_replay), verification by the live Qolda.
#   avl_kk_e2e      - end-to-end: Qolda-AVL hears the recording (runs/speech/S01_skip, human speaker S01)
#   avl_kk_cascade  - cascade: Qolda-AVL's transcript, parsed by Qolda 4B as typed text (runs/speech/cascade_S01_qolda)
# Chooses which of the two goes to the robot-vacuum (rule in docs/decisions.md D-078). One human speaker (S01): a pilot (D-081).
name: dev_agent_speech_s01
title: "DEV: spoken commands (Qolda-AVL), human speaker S01, standard agent (D-081)"
out_root: runs/matrix
seeds: [0]
common:
  - dataset=hm3d_objectnav_v1_train
  - embodiment=habitat_agent
  - value_encoder=siglip2_base
  - run.episodes.subset_file=splits/hm3d_v1_dev_agent.txt
  - run.video.fraction=0.05
servers:
  qolda: {start: bash tools/start_qolda.sh, pid_file: runs/servers/qolda.pid, health: "http://127.0.0.1:23333/v1/models"}
arms:
  - {key: avl_kk_e2e, label: "Spoken kk, end-to-end: Qolda-AVL parses the recording; Qolda 4B verifies", lang: kk,
     server: qolda, accent: true,
     overrides: [backend=qolda, backend.prompts.parse_goal=default/parse_goal/v4, policy.verification.question_lang=en,
                 policy.stop.calibration_file=calib/qolda_dev23_en.json, policy.verification.commit_approach=true,
                 policy.verification.verify_range_m=1.5, policy.approach.stop_mode=visible,
                 ++backend.parse_replay.prompt=speech/parse_goal/v1,
                 "++backend.parse_replay.sources=[runs/speech/S01_skip/vlm_calls.jsonl]"]}
  - {key: avl_kk_cascade, label: "Spoken kk, cascade: Qolda-AVL transcript, Qolda 4B parses and verifies", lang: kk,
     server: qolda,
     overrides: [backend=qolda, backend.prompts.parse_goal=default/parse_goal/v4, policy.verification.question_lang=en,
                 policy.stop.calibration_file=calib/qolda_dev23_en.json, policy.verification.commit_approach=true,
                 policy.verification.verify_range_m=1.5, policy.approach.stop_mode=visible,
                 ++backend.parse_replay.prompt=default/parse_goal/v4,
                 "++backend.parse_replay.sources=[runs/speech/cascade_S01_qolda/vlm_calls.jsonl]"]}
contrasts: [[avl_kk_e2e, avl_kk_cascade]]
breakdowns: [goal_category]
