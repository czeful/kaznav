# D-071 step 2': c2 with a stricter stop threshold - the lowest with precision >= 0.7 on the same calibration calls
# (calib/qolda_dev18_en_p70.json, 0.427 instead of the max-F1 0.285). Rule (docs/decisions.md D-071): adopted for every
# verifier arm if c2s has at least 3 more successes than c2 (dev_english_v4) on the same 85 dev_tune85 episodes.
name: dev_threshold
title: "DEV: stricter stop threshold (D-071, step 2')"
out_root: runs/matrix
seeds: [0]
common:
  - dataset=hm3d_objectnav_v1_train
  - embodiment=wheeled_vacuum_kinematic
  - eval.episode_budget.max_decision_steps=800
  - value_encoder=siglip2_base
  - run.episodes.subset_file=splits/hm3d_v1_dev_tune85.txt
  - run.video.fraction=0.05
  - backend=qolda
  - backend.prompts.parse_goal=default/parse_goal/v4
  - policy.verification.question_lang=en
  - policy.verification.commit_approach=true
  - policy.verification.verify_range_m=1.5
  - policy.approach.stop_mode=visible
servers:
  qolda: {start: bash tools/start_qolda.sh, pid_file: runs/servers/qolda.pid, health: "http://127.0.0.1:23333/v1/models"}
arms:
  - {key: c2s_qolda_kk, label: "Qolda kk, as c2, stop threshold for precision >= 0.7", lang: kk, server: qolda,
     accent: true, overrides: [policy.stop.calibration_file=calib/qolda_dev18_en_p70.json]}
breakdowns: [goal_category]
