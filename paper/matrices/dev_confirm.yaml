# D-073 stage 4: confirmation of stages 1-3 on 72 episodes of 10 train scenes used nowhere before
# (splits/hm3d_v1_dev3.txt, frozen in D-070 stage 0). Chooses NOTHING. "New" verifier settings: parse_goal v4, the
# English question about the model's own short English name (target_en), the last metre (commit + ask from afar +
# stop where in view), D-069, calibration on 18 dev scenes for the English question, max-F1 threshold. Also: no
# verification, the command-language question (secondary row, parse v2) and the stage A settings ("old"). Three
# arms were left out on 2026-10-19 and restored on 2026-10-21 by the user's decision (D-073).
name: dev_confirm
title: "DEV confirmation of the improvements on fresh scenes (D-073, stage 4)"
out_root: runs/matrix
seeds: [0]
common:
  - dataset=hm3d_objectnav_v1_train
  - embodiment=wheeled_vacuum_kinematic
  - eval.episode_budget.max_decision_steps=800
  - value_encoder=siglip2_base
  - run.episodes.subset_file=splits/hm3d_v1_dev3.txt
  - run.video.fraction=0.2
servers:
  qolda: {start: bash tools/start_qolda.sh, pid_file: runs/servers/qolda.pid, health: "http://127.0.0.1:23333/v1/models"}
  qwen: {start: bash tools/start_qwen.sh, pid_file: runs/servers/qwen.pid, health: "http://127.0.0.1:23334/v1/models"}
arms:
  # ---- references (no VLM)
  - {key: vlfm_en, label: "VLFM-style, English label (no VLM)", lang: none, overrides: []}
  - {key: oracle, label: "Ground-truth detector (navigation ceiling), stop where in view", lang: none,
     overrides: [detector=oracle_semantic, segmenter=box, perception.detection.fusion.enabled=false,
                 policy.approach.stop_mode=visible]}
  # ---- Qolda
  - {key: qolda_kk, label: "Qolda, kk (new)", lang: kk, server: qolda, accent: true,
     overrides: [backend=qolda, backend.prompts.parse_goal=default/parse_goal/v4, policy.verification.question_lang=en,
                 policy.stop.calibration_file=calib/qolda_dev18_en.json, policy.verification.commit_approach=true,
                 policy.verification.verify_range_m=1.5, policy.approach.stop_mode=visible]}
  - {key: qolda_kkru, label: "Qolda, kk-ru (new)", lang: kk_ru, server: qolda,
     overrides: [backend=qolda, backend.prompts.parse_goal=default/parse_goal/v4, policy.verification.question_lang=en,
                 policy.stop.calibration_file=calib/qolda_dev18_en.json, policy.verification.commit_approach=true,
                 policy.verification.verify_range_m=1.5, policy.approach.stop_mode=visible]}
  - {key: qolda_en, label: "Qolda, en (new)", lang: en, server: qolda,
     overrides: [backend=qolda, backend.prompts.parse_goal=default/parse_goal/v4, policy.verification.question_lang=en,
                 policy.stop.calibration_file=calib/qolda_dev18_en.json, policy.verification.commit_approach=true,
                 policy.verification.verify_range_m=1.5, policy.approach.stop_mode=visible]}
  - {key: qolda_kk_nv, label: "Qolda, kk, no verification", lang: kk, verify: false, server: qolda,
     overrides: [backend=qolda, backend.prompts.parse_goal=default/parse_goal/v4]}
  - {key: qolda_kk_cmdq, label: "Qolda, kk, question in the command language (secondary)", lang: kk, server: qolda,
     overrides: [backend=qolda, policy.stop.calibration_file=calib/qolda_dev18.json,
                 policy.verification.commit_approach=true, policy.verification.verify_range_m=1.5,
                 policy.approach.stop_mode=visible]}
  - {key: qolda_kk_old, label: "Qolda, kk, stage A settings (old)", lang: kk, server: qolda,
     overrides: [backend=qolda, policy.stop.calibration_file=calib/qolda_dev.json]}
  # ---- Qwen
  - {key: qwen_kk, label: "Qwen3-VL-4B, kk (new)", lang: kk, server: qwen,
     overrides: [backend=qwen3vl_4b, backend.prompts.parse_goal=default/parse_goal/v4,
                 policy.verification.question_lang=en, policy.stop.calibration_file=calib/qwen3vl_4b_dev18_en.json,
                 policy.verification.commit_approach=true, policy.verification.verify_range_m=1.5,
                 policy.approach.stop_mode=visible]}
  - {key: qwen_kkru, label: "Qwen3-VL-4B, kk-ru (new)", lang: kk_ru, server: qwen,
     overrides: [backend=qwen3vl_4b, backend.prompts.parse_goal=default/parse_goal/v4,
                 policy.verification.question_lang=en, policy.stop.calibration_file=calib/qwen3vl_4b_dev18_en.json,
                 policy.verification.commit_approach=true, policy.verification.verify_range_m=1.5,
                 policy.approach.stop_mode=visible]}
  - {key: qwen_en, label: "Qwen3-VL-4B, en (new)", lang: en, server: qwen,
     overrides: [backend=qwen3vl_4b, backend.prompts.parse_goal=default/parse_goal/v4,
                 policy.verification.question_lang=en, policy.stop.calibration_file=calib/qwen3vl_4b_dev18_en.json,
                 policy.verification.commit_approach=true, policy.verification.verify_range_m=1.5,
                 policy.approach.stop_mode=visible]}
  - {key: mt_qwen_kk, label: "NLLB kk->en, then Qwen3-VL-4B (new)", lang: kk, server: qwen,
     overrides: [backend=qwen3vl_4b, goal=mt_command, backend.prompts.parse_goal=default/parse_goal/v4,
                 policy.verification.question_lang=en, policy.stop.calibration_file=calib/qwen3vl_4b_dev18_en.json,
                 policy.verification.commit_approach=true, policy.verification.verify_range_m=1.5,
                 policy.approach.stop_mode=visible]}
  - {key: mt_qwen_kkru, label: "NLLB kk-ru->en, then Qwen3-VL-4B (new)", lang: kk_ru, server: qwen,
     overrides: [backend=qwen3vl_4b, goal=mt_command, backend.prompts.parse_goal=default/parse_goal/v4,
                 policy.verification.question_lang=en, policy.stop.calibration_file=calib/qwen3vl_4b_dev18_en.json,
                 policy.verification.commit_approach=true, policy.verification.verify_range_m=1.5,
                 policy.approach.stop_mode=visible]}
  - {key: qwen_kk_nv, label: "Qwen3-VL-4B, kk, no verification", lang: kk, verify: false, server: qwen,
     overrides: [backend=qwen3vl_4b, backend.prompts.parse_goal=default/parse_goal/v4]}
  - {key: qwen_kk_cmdq, label: "Qwen3-VL-4B, kk, question in the command language (secondary)", lang: kk, server: qwen,
     overrides: [backend=qwen3vl_4b, policy.stop.calibration_file=calib/qwen3vl_4b_dev18.json,
                 policy.verification.commit_approach=true, policy.verification.verify_range_m=1.5,
                 policy.approach.stop_mode=visible]}
  - {key: qwen_en_old, label: "Qwen3-VL-4B, en, stage A settings (old)", lang: en, server: qwen,
     overrides: [backend=qwen3vl_4b, policy.stop.calibration_file=calib/qwen3vl_4b_dev.json]}
contrasts:
  - [qwen_en, qwen_en_old]
  - [qolda_kk, qolda_kk_cmdq]
  - [qwen_kk, qwen_kk_cmdq]
  - [qolda_kk, qolda_kk_old]
  - [qolda_kk, qwen_kk]
  - [qolda_kkru, qwen_kkru]
  - [qolda_kk, mt_qwen_kk]
  - [qolda_kkru, mt_qwen_kkru]
  - [qolda_en, qolda_kk]
  - [qwen_en, qwen_kk]
  - [qolda_kk, qolda_kk_nv]
  - [qwen_kk, qwen_kk_nv]
  - [qolda_kk, vlfm_en]
decompositions: [[qolda_en, qolda_kk], [qwen_en, qwen_kk]]
breakdowns: [goal_category]
