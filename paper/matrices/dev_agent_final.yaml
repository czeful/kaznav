# D-076 stage 5: the final system of stage 4 on the standard Habitat agent (camera 0.88 m) - where we stand against
# published numbers (dev, train scenes; the comparable table (a) runs on val after the analysis plan is frozen).
# Chooses NOTHING. Calibration of the English question from dev2 + dev3 scenes only (no overlap with these episodes).
name: dev_agent_final
title: "DEV: final system on the standard agent (D-076, stage 5)"
out_root: runs/matrix
seeds: [0]
common:
  - dataset=hm3d_objectnav_v1_train
  - embodiment=habitat_agent
  - value_encoder=siglip2_base
  - run.episodes.subset_file=splits/hm3d_v1_dev_agent.txt
  - run.video.fraction=0.05
servers:
  qolda: {start: bash tools/start_qolda.sh, pid_file: runs/servers/qolda.pid, health: "http://127.0.0.1:23333/v1/models"}
  qwen: {start: bash tools/start_qwen.sh, pid_file: runs/servers/qwen.pid, health: "http://127.0.0.1:23334/v1/models"}
arms:
  - {key: vlfm_en, label: "VLFM-style, English label (no VLM)", lang: none, overrides: []}
  - {key: vlfm_closed, label: "VLFM-style, closed-set COCO detector 0.8, SAM, no fusion (as VLFM)", lang: none,
     overrides: [detector=rtdetr_coco, segmenter=sam2_tiny, perception.detection.fusion.enabled=false]}
  - {key: oracle, label: "Ground-truth detector (navigation ceiling), stop where in view", lang: none,
     overrides: [detector=oracle_semantic, segmenter=box, perception.detection.fusion.enabled=false,
                 policy.approach.stop_mode=visible]}
  - {key: qwen_en, label: "Qwen3-VL-4B, en (final system)", lang: en, server: qwen,
     overrides: [backend=qwen3vl_4b, backend.prompts.parse_goal=default/parse_goal/v4, policy.verification.question_lang=en,
                 policy.stop.calibration_file=calib/qwen3vl_4b_dev23_en.json, policy.verification.commit_approach=true,
                 policy.verification.verify_range_m=1.5, policy.approach.stop_mode=visible]}
  - {key: qolda_kk, label: "Qolda, kk (final system)", lang: kk, server: qolda, accent: true,
     overrides: [backend=qolda, backend.prompts.parse_goal=default/parse_goal/v4, policy.verification.question_lang=en,
                 policy.stop.calibration_file=calib/qolda_dev23_en.json, policy.verification.commit_approach=true,
                 policy.verification.verify_range_m=1.5, policy.approach.stop_mode=visible]}
contrasts: [[qolda_kk, vlfm_en], [qwen_en, vlfm_en], [qwen_en, vlfm_closed]]
breakdowns: [goal_category]
