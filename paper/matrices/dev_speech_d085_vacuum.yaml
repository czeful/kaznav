# D-085 step 2, robot-vacuum: spoken commands of speaker S01 through the cascade with loudness normalisation (v1,
# chosen by the step-1 rule): Qolda-AVL transcribes the peak-normalised recording, Qolda 4B parses the transcript
# (prompt v4) and verifies. Everything else as avl_kk_cascade of dev_speech_vacuum_s01 (D-081) and qolda_kk /
# qolda_kkru of dev_confirm (stage 4) - only the parse source differs. One human speaker (S01): a pilot.
name: dev_speech_d085_vacuum
title: "DEV: spoken commands, cascade with loudness normalisation, speaker S01, robot-vacuum, dev3 (D-085)"
out_root: runs/matrix
seeds: [0]
common:
  - dataset=hm3d_objectnav_v1_train
  - embodiment=wheeled_vacuum_kinematic
  - eval.episode_budget.max_decision_steps=800
  - value_encoder=siglip2_base
  - run.episodes.subset_file=splits/hm3d_v1_dev3.txt
  - run.video.fraction=0.2
servers:
  qolda: {start: bash tools/start_qolda.sh, pid_file: runs/servers/qolda.pid, health: "http://127.0.0.1:23333/v1/models"}
arms:
  - {key: avl_kk_cascade_lvl, label: "Spoken kk, cascade, loudness-normalised recording; Qolda 4B parses and verifies",
     lang: kk, server: qolda, accent: true,
     overrides: [backend=qolda, backend.prompts.parse_goal=default/parse_goal/v4, policy.verification.question_lang=en,
                 policy.stop.calibration_file=calib/qolda_dev18_en.json, policy.verification.commit_approach=true,
                 policy.verification.verify_range_m=1.5, policy.approach.stop_mode=visible,
                 ++backend.parse_replay.prompt=default/parse_goal/v4,
                 "++backend.parse_replay.sources=[runs/speech/d085/v1_S01/vlm_calls.jsonl]"]}
  - {key: avl_kkru_cascade_lvl, label: "Spoken kk-ru, cascade, loudness-normalised recording; Qolda 4B parses and verifies",
     lang: kk_ru, server: qolda,
     overrides: [backend=qolda, backend.prompts.parse_goal=default/parse_goal/v4, policy.verification.question_lang=en,
                 policy.stop.calibration_file=calib/qolda_dev18_en.json, policy.verification.commit_approach=true,
                 policy.verification.verify_range_m=1.5, policy.approach.stop_mode=visible,
                 ++backend.parse_replay.prompt=default/parse_goal/v4,
                 "++backend.parse_replay.sources=[runs/speech/d085/v1_S01/vlm_calls.jsonl]"]}
breakdowns: [goal_category]
