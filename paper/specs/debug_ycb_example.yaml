# Example spec on the DEBUG matrix runs (apartment_1 + 4 YCB objects, 20 episodes): checks the table generator on
# real run files. Debug numbers - never a paper table. A paper spec lists runs/eval/<dir> of HM3D runs instead.
title: "DEBUG: debug_ycb, wheeled robot, 20 episodes"
arms:
  - {key: gd_value, label: "GroundingDINO + value map, English category", runs: [runs/debug/20260924T194018Z]}
  - {key: qolda_kk, label: "Qolda, kk", runs: [runs/debug/20260924T194630Z], accent: true}
  - {key: qolda_kk_top1, label: "Qolda, kk, one hypothesis", runs: [runs/debug/20261003T214344Z]}
  - {key: mt_word, label: "NLLB word + Qolda verification", runs: [runs/debug/20261003T220746Z]}
  - {key: mt_command, label: "NLLB command -> English pipeline", runs: [runs/debug/20261003T224341Z]}
  - {key: qwen_kk, label: "Qwen3-VL-4B, kk", runs: [runs/debug/20261004T024304Z]}
  - {key: qolda_en, label: "Qolda, en", runs: [runs/debug/20260926T045345Z]}
  - {key: qwen_en, label: "Qwen3-VL-4B, en", runs: [runs/debug/20261004T034737Z]}
contrasts: [[qolda_kk, gd_value], [qolda_kk_top1, qolda_kk], [mt_word, qolda_kk], [mt_command, qolda_kk],
            [qolda_kk, qwen_kk, qolda_en, qwen_en],
            [qwen_kk, qolda_kk], [qwen_en, qolda_en]]
decompositions: [[qolda_en, qolda_kk], [qwen_en, qwen_kk]]
breakdowns: [goal_category]
