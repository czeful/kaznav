[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kznav"
version = "0.1.0"
description = "Zero-shot ObjectNav bench for a low wheeled robot with swappable VLM backends (Kazakh / mixed / English commands)"
readme = "README.md"
# 3.9 is the Habitat conda baseline (habitat-sim 0.2.4); keep the core importable there.
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.6,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6",
    "pillow>=9",
    "hydra-core>=1.3,<1.4",
    "omegaconf>=2.3,<2.4",
    "pandas>=2.2",
    "tabulate>=0.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["kznav*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
markers = [
    "gpu: needs a CUDA GPU",
    "habitat: needs habitat-sim",
    "server: needs a running VLM server",
]
