# Gemma 3 4B instruction-tuned (google/gemma-3-4b-it, Gemma Terms of Use) — the third model of the comparison: the
# same size as Qolda and Qwen3-VL-4B, another family (D-083). servers/gemma_server.py, tools/start_gemma.sh.
name: gemma3_4b
type: openai_compat
model_id: gemma-3-4b
hf_repo: google/gemma-3-4b-it
weights_precision: bf16            # as Qolda and Qwen (D-006)
server:
  impl: kznav_fastapi              # the Qolda server's API; images: Gemma's own fixed 896x896 view (256 tokens)
base_url: http://localhost:23335/v1
api_key: EMPTY
http:
  timeout_s: 60
  max_attempts: 3
  backoff_s: 1.0
temperature: 0.0
seed: 0
max_tokens:
  parse_goal: 512
  verify_candidate: 4
  describe: 256
top_logprobs: 10
extra_body: {}
control_think_measurement: false
image:
  format: png
  max_side: null
parse:
  max_attempts: 3
  min_hypotheses: 1
  max_hypotheses: 8
capabilities:
  supports_logprobs: true
  supports_images: true
  max_context_tokens: 4096
  cost_per_call_usd: null
prompts:                           # identical prompts by default: differences come from the model
  parse_goal: default/parse_goal/v2       # the reported arms override to v4, as for Qolda and Qwen
  verify_candidate: default/verify_candidate/v1
  describe: default/describe/v1
warmup_calls: 3
