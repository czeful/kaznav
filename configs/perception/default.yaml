map:
  size_m: 40.0                    # square map centred on the episode start
  resolution_m: 0.05
  pixel_stride: 4                 # depth pixels sampled every 4 px
  max_range_m: 4.5                # depth beyond this is ignored (sensor max 5.0)
  log_odds: {hit: 0.85, miss: -0.5, min: -3.5, max: 3.5}   # free after one look (p 0.38), occupied after two hits (p 0.85)
  p_occupied: 0.8                 # needs >= 2 consistent hits: single spurious hits walled the robot in (D-019)
  p_free: 0.4                     # conflicting evidence (hit then miss: p 0.59) stays undecided
  obstacle_min_height_m: 0.03     # floor noise tolerance; the effective minimum is max(this, navmesh climb)
  obstacle_margin_above_top_m: 0.03   # band top = embodiment top + this; anything higher is passable
  cliff_depth_m: 0.05             # points this far below the floor (holes, steps down) are obstacles (D-026)
  missing_return_max_range_m: 1.5 # downward pixels with no depth return: drop-off where the floor should be (D-031); 0 = off
frontiers:
  min_size_cells: 6
detection:
  score_threshold: 0.35           # detector confidence to create / update an object candidate
  min_mask_pixels: 50             # mask pixels with valid depth needed to localise a detection
  merge_radius_m: 0.6             # detections (of any query) closer than this are one candidate
  max_points_per_detection: 400
  point_filter:                   # candidate points without a real segmenter (D-054); 0 = off
    floor_margin_m: 0.05          # drop points less than this above the floor (the floor inside a low camera's box)
    depth_band_m: 0.5             # keep the front layer: depth within this of the nearest 5% (not the wall behind)
  add_target_name: false          # D-072: the model's short English name (parse v4 target_en) as one more query
  fusion:                         # target-centric fusion across frames (D-060, after ApexNav); on by default (D-064)
    enabled: true
    reliable_confidence: 0.45     # fused confidence a candidate needs to be approached; below it: suspected (dev, D-060)
    min_visible_points: 20        # stored points in view needed to count a frame without a detection against it
    occlusion_tolerance_m: 0.3    # a stored point behind an observed surface nearer by more than this is occluded
