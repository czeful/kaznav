# HM3D ObjectNav v1, val split (2000 episodes, 6 categories) — the split VLFM reports on.
name: hm3d_objectnav_v1
split: val
role: benchmark               # benchmark | dev | debug  (dev and debug sets never enter the main tables)
scenes_dir: ${paths.data_root}/scene_datasets/hm3d
scene_root: ${paths.data_root}/scene_datasets    # episode scene ids are relative to this (verify on the data)
scene_dataset_config: ${paths.data_root}/scene_datasets/hm3d/hm3d_annotated_basis.scene_dataset_config.json
episodes_path: ${paths.data_root}/datasets/objectnav/hm3d/v1/val/val.json.gz
success_distance_m: 0.1       # to the nearest goal view point (habitat-lab ObjectNav)
distance_to: view_points
max_episode_steps: 500        # habitat-lab ObjectNav step limit (discrete agent)
lexicon: lexicon/hm3d_objectnav.yaml
commands: commands/hm3d_objectnav_v1.yaml
