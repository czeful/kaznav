# HM3D ObjectNav v1, TRAIN split: the source of DEV episodes - calibration, thresholds, prompts, camera pitch (D-004),
# episode budget (D-005). role: dev - never in the main tables; tools/make_split.py picks the dev scenes and episodes.
# The val split stays untouched until the reported runs.
name: hm3d_objectnav_v1
split: train
role: dev
scenes_dir: ${paths.data_root}/scene_datasets/hm3d
scene_root: ${paths.data_root}/scene_datasets    # episode scene ids are relative to this (verify on the data)
scene_dataset_config: ${paths.data_root}/scene_datasets/hm3d/hm3d_annotated_basis.scene_dataset_config.json
episodes_path: ${paths.data_root}/datasets/objectnav/hm3d/v1/train/train.json.gz
success_distance_m: 0.1
distance_to: view_points
max_episode_steps: 500
lexicon: lexicon/hm3d_objectnav.yaml
commands: commands/natural/hm3d_objectnav_v1.yaml   # natural commands; role dev uses the dev ones (D-048)
