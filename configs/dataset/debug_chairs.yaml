# DEBUG dataset: habitat test scenes with placed test chairs (known semantic ids).
# role: debug — for pipeline checks and videos only; never in the main tables.
name: debug_chairs
split: debug
role: debug
scenes:
  - scene_datasets/habitat-test-scenes/apartment_1.glb
objects:
  - category: chair
    config_path: ${paths.data_root}/objects/chair.object_config.json   # habitat-sim test asset, copied
    count: 4
min_separation_m: 1.5
episodes_per_scene: 5
min_geodesic_m: 2.0
max_geodesic_m: 10.0
success_distance_m: 0.1
distance_to: view_points
lexicon: lexicon/hm3d_objectnav.yaml
