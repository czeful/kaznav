# Standard Habitat ObjectNav agent (habitat-lab 0.2.4 objectnav_hm3d.yaml).
# Used for the literature-comparable table (D-001): same pipeline, standard embodiment,
# standard episodes, standard discrete action space and step limit.
name: habitat_agent
kind: point_agent

body:
  radius_m: 0.18
  height_m: 0.88

drive:
  type: discrete
  forward_step_m: 0.25
  turn_angle_deg: 30.0
  tilt_angle_deg: 30.0

physics:
  mode: none                  # habitat-lab default: navmesh sliding, no dynamics

navmesh:
  source: dataset             # the navmesh shipped with the scene dataset; recomputed with these if absent
  agent_radius_m: 0.18
  agent_height_m: 0.88
  agent_max_climb_m: 0.2
  agent_max_slope_deg: 45.0
  cell_size_m: 0.05
  cell_height_m: 0.2

sensors:
  rgbd:
    resolution_hw: [480, 640]
    hfov_deg: 79.0
    mount:
      height_m: 0.88
      forward_m: 0.0
      pitch_deg: 0.0
    depth:
      min_m: 0.5
      max_m: 5.0
  semantic: true              # ground truth only (view points, funnel metrics, oracle ablation)
  odometry:
    enabled: false
  imu:
    enabled: false

localization: ground_truth

noise:
  depth: {model: none}
  actuation: {model: none}
  odometry_drift: {model: none}
