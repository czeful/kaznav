# Root config. Every tunable number of the pipeline lives in this tree; the code has none.
# Switch a component with one override, e.g.:  backend=qolda dataset=hm3d_ovon_val_unseen embodiment=habitat_agent
defaults:
  - embodiment: wheeled_vacuum
  - dataset: hm3d_objectnav_v1_val
  - backend: mock
  - perception: default
  - detector: mm_grounding_dino_base   # the D-060 stack, chosen on dev (D-064); none / oracle_semantic for ablations
  - segmenter: sam2_tiny               # box: the D-054 box masks (ablation)
  - value_encoder: none
  - goal: multi                  # what the parsed goal hands to the pipeline; ablations: top1 | mt_word | mt_command
  - policy: default
  - eval: default
  - _self_

run:
  name: ${backend.name}__${dataset.name}__${embodiment.name}
  seed: 0
  output_root: runs
  resume: true
  episodes:
    limit: null           # null = the whole split
    subset_file: null     # optional text file with episode ids (dev / test subsets)
  video:
    enabled: true
    fraction: 0.05        # deterministic subsample of episodes (by seed) that get a video
  max_episode_attempts: 2       # an episode that raised this often is given up (stays in failures.csv, D-046)
  max_consecutive_failures: 3   # this many failed episodes in a row abort the run (server or simulator down)

sim:
  # -1: no CUDA/EGL device matching — required under WSL2, where Mesa renders via D3D12 (D-008).
  # On a Linux server with NVIDIA EGL set KZNAV_GPU_DEVICE_ID=0.
  gpu_device_id: ${oc.env:KZNAV_GPU_DEVICE_ID,-1}

paths:
  # Datasets live on the WSL ext4 disk (9P access to /mnt/c is slow for GLB loading).
  data_root: ${oc.env:KZNAV_DATA_ROOT,data}
  prompt_root: prompts
