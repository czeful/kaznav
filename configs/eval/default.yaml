bootstrap:
  n_boot: 10000
  level: 0.95
  seed: 0
calibration:
  n_bins: 10
  ece_default: binary                # binary | top_label (top_label only to reproduce the pilot)
success:
  require_visible_at_stop: false     # visibility is encoded in the goal view points
collisions:
  merge_gap_s: 0.5
stuck:
  window_s: 3.0
  min_displacement_m: 0.05
  min_yaw_change_rad: 0.1
  min_cmd_lin: 0.05
  min_cmd_ang: 0.2
  abort_after_s: 30.0                # stuck longer than this ends the episode (Termination.STUCK_ABORT)
latency:
  percentiles: [50, 95]
episode_budget:                      # OPEN (D-005): fixed before the first measured run
  max_decision_steps: 500            # point agent: one discrete action per decision (habitat standard)
  decision_period_s: 0.5             # wheeled robot: simulated time per decision step
funnel:
  min_goal_pixels: 100               # goal instance "in view" if at least this many pixels of it are visible
  detection_goal_overlap: 0.3        # a detection "hits" the goal if this fraction of its box is goal pixels
  stop_candidate_radius_m: 0.3       # stop candidate counts as the goal if within this of a goal AABB
view_points:                         # per-embodiment goal view points (D-001)
  success_radius_m: 1.0
  grid_step_m: 0.1
  min_pixels: 100
  max_snap_m: 0.05
fall:                                # robot fell (scan hole, step down) -> Termination.FELL
  max_tilt_deg: 60.0
  max_drop_m: 0.3                    # reference point this far below its start height
